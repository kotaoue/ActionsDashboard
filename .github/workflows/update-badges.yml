name: Update Badges

on:
  schedule:
    - cron: '13 4 * * 0'  # Weekly on Sunday at 04:13 UTC (off-peak to avoid rate limits)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_dashboard.py

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="update-badges"

          if git diff --quiet dashboard/index.html; then
            echo "No changes detected, skipping PR creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add dashboard/index.html
          git commit -m "chore: update action badges"
          git push -f origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists and has been updated by the push."
          else
            gh pr create \
              --title "chore: update action badges" \
              --body "Automatically updated action badges from kotaoue/* repositories." \
              --base main \
              --head "$BRANCH"
          fi
